# ─────────────────────────────────────────────────────────────────────────────
#  buildspec.yml — AWS CodeBuild Build Specification
#  Project  : FoodHub Restaurant Order System
#  Pipeline : CodePipeline → CodeBuild → ECR → ECS
#
#  ECR Registry : 491694398940.dkr.ecr.ap-south-1.amazonaws.com
#  ECR Repo     : restaurant-order-system
#  ECS Cluster  : arn:aws:ecs:ap-south-1:491694398940:cluster/restaurant-order-system
#  Region       : ap-south-1
#
#  Required CodeBuild environment variable (set in the pipeline / project):
#    ECS_SERVICE_NAME        Name of the ECS service to update (e.g. restaurant-backend)
#
#  Required IAM permissions for the CodeBuild service role:
#    ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,
#    ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
#    ecr:PutImage, secretsmanager:GetSecretValue,
#    ecs:UpdateService, ecs:DescribeServices
# ─────────────────────────────────────────────────────────────────────────────

version: 0.2

env:
  variables:
    # ── ECR details (hardcoded) ───────────────────────────────────────────────
    AWS_ACCOUNT_ID:     "491694398940"
    AWS_DEFAULT_REGION: "ap-south-1"
    ECR_REPO_NAME:      "restaurant-order-system"
    ECR_REGISTRY:       "491694398940.dkr.ecr.ap-south-1.amazonaws.com"
    # ── ECS details (hardcoded) ───────────────────────────────────────────────
    ECS_CLUSTER:        "restaurant-order-system"
    ECS_CLUSTER_ARN:    "arn:aws:ecs:ap-south-1:491694398940:cluster/restaurant-order-system"
    # ECS_SERVICE_NAME must be set in CodeBuild project / pipeline env vars
    # Derived image tag — overridden at runtime by the "pre_build" phase
    IMAGE_TAG:          "latest"

  # Inject sensitive values from AWS Secrets Manager at build time
  secrets-manager:
    DB_HOST:     "foodhub/prod:DB_HOST"
    DB_USER:     "foodhub/prod:DB_USER"
    DB_PASSWORD: "foodhub/prod:DB_PASSWORD"
    DB_NAME:     "foodhub/prod:DB_NAME"
    JWT_SECRET:  "foodhub/prod:JWT_SECRET"

phases:

  # ── 1. Install ───────────────────────────────────────────────────────────────
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== Install phase — $(date) ==="
      - node --version
      - npm --version
      # Install the AWS CLI v2 helper for ECR login (pre-installed on standard images,
      # but kept explicit for custom images)
      - pip3 install --quiet --upgrade awscli || true

  # ── 2. Pre-Build ─────────────────────────────────────────────────────────────
  pre_build:
    commands:
      - echo "=== Pre-Build phase — $(date) ==="

      # Build a deterministic image tag from the git commit SHA
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - IMAGE_TAG="${COMMIT_HASH:-latest}"
      - ECR_URI="491694398940.dkr.ecr.ap-south-1.amazonaws.com/restaurant-order-system"
      - IMAGE_FULL="${ECR_URI}:${IMAGE_TAG}"
      - IMAGE_LATEST="${ECR_URI}:latest"

      # Authenticate Docker to Amazon ECR
      - echo "Logging in to Amazon ECR…"
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin ${ECR_URI}

      # Install backend dependencies for test/lint
      - echo "Installing Node.js dependencies…"
      - cd restaurant-order-system/backend
      - npm ci --omit=dev
      - cd ../..

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    commands:
      - echo "=== Build phase — $(date) ==="

      # ── Lint / syntax check ────────────────────────────────────────────────
      - echo "Running syntax check…"
      - cd restaurant-order-system/backend
      - node --check server.js
      - |
        for f in $(find routes controllers middleware services -name "*.js" 2>/dev/null); do
          node --check "$f"
        done
      - cd ../..

      # ── Security audit ────────────────────────────────────────────────────
      - echo "Running npm audit…"
      - cd restaurant-order-system/backend
      - npm audit --audit-level=high || true    # warn-only; change to fail as needed
      - cd ../..

      # ── Docker build ──────────────────────────────────────────────────────
      - echo "Building Docker image: ${IMAGE_FULL}"
      - |
        docker build \
          --file restaurant-order-system/backend/Dockerfile \
          --target production \
          --build-arg NODE_ENV=production \
          --tag "${IMAGE_FULL}" \
          --tag "${IMAGE_LATEST}" \
          restaurant-order-system/backend

  # ── 4. Post-Build ────────────────────────────────────────────────────────────
  post_build:
    commands:
      - echo "=== Post-Build phase — $(date) ==="

      # ── Push image to ECR ─────────────────────────────────────────────────
      - echo "Pushing Docker image to ECR…"
      - docker push "${IMAGE_FULL}"
      - docker push "${IMAGE_LATEST}"

      # ── Write imagedefinitions.json (consumed by CodePipeline ECS deploy) ─
      - |
        printf '[{"name":"%s","imageUri":"%s"}]' \
          "${ECR_REPO_NAME}" \
          "${IMAGE_FULL}" \
          > imagedefinitions.json
      - cat imagedefinitions.json

      # ── Deploy to ECS — trigger a new deployment on the cluster ──────────
      - echo "Deploying to ECS cluster: ${ECS_CLUSTER} / service: ${ECS_SERVICE_NAME}…"
      - |
        aws ecs update-service \
          --cluster "${ECS_CLUSTER}" \
          --service "${ECS_SERVICE_NAME}" \
          --force-new-deployment \
          --region ap-south-1

      # ── Wait for the service to stabilise (tasks healthy) ─────────────────
      - echo "Waiting for ECS service to reach steady state…"
      - |
        aws ecs wait services-stable \
          --cluster "${ECS_CLUSTER}" \
          --services "${ECS_SERVICE_NAME}" \
          --region ap-south-1

      - echo "=== ECS deployment complete — $(date) ==="

# ── Artifacts ────────────────────────────────────────────────────────────────
# imagedefinitions.json is consumed by a downstream CodeDeploy / ECS action.
# Build logs are retained automatically in CloudWatch Logs.
artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes

# ── Cache ─────────────────────────────────────────────────────────────────────
# Caching node_modules across builds dramatically reduces install time.
cache:
  paths:
    - restaurant-order-system/backend/node_modules/**/*
