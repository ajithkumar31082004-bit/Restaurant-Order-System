# buildspec.yml - AWS CodeBuild Build Specification
# Project  : FoodHub Restaurant Order System
# Pipeline : CodePipeline -> CodeBuild -> ECR -> EC2 (Docker)
#
# ECR Registry : 491694398940.dkr.ecr.ap-south-1.amazonaws.com
# ECR Repo     : dev/restaurant-order-system
# ECR ARN      : arn:aws:ecr:ap-south-1:491694398940:repository/dev/restaurant-order-system
# Region       : ap-south-1
#
# Required CodeBuild environment variables (set in the pipeline / project):
#   EC2_HOST             - Public IP or DNS of the EC2 instance
#   EC2_USER             - e.g. ubuntu or ec2-user
#   EC2_SSH_KEY_SECRET   - AWS Secrets Manager secret name holding the PEM key
#
# Required CodeBuild project env vars (set in CodeBuild console under Environment):
#   DB_HOST, DB_USER, DB_PASSWORD, DB_NAME, JWT_SECRET
#   EC2_HOST, EC2_USER, EC2_SSH_KEY (PEM key content, mark as sensitive)
#
# Required IAM permissions for the CodeBuild service role:
#   ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability,
#   ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload,
#   ecr:PutImage

version: 0.2

env:
  variables:
    ECR_REGISTRY: "491694398940.dkr.ecr.ap-south-1.amazonaws.com"
    ECR_REPO: "dev/restaurant-order-system"
    IMAGE_TAG: "latest"
    CONTAINER_PORT: "5000"
    # DB_HOST, DB_USER, DB_PASSWORD, DB_NAME, JWT_SECRET
    # EC2_HOST, EC2_USER, EC2_SSH_KEY
    # --> Set these in CodeBuild project > Environment > Additional configuration > Environment variables

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== INSTALL PHASE ==="
      - node --version
      - npm --version

  pre_build:
    commands:
      - echo "=== PRE-BUILD PHASE ==="
      - export IMAGE_FULL="491694398940.dkr.ecr.ap-south-1.amazonaws.com/dev/restaurant-order-system:latest"
      - echo "Image - $IMAGE_FULL"
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 491694398940.dkr.ecr.ap-south-1.amazonaws.com
      - echo "Installing Node.js dependencies..."
      - cd restaurant-order-system/backend && npm ci --omit=dev && cd ../..

  build:
    commands:
      - echo "=== BUILD PHASE ==="
      - echo "Running syntax check..."
      - cd restaurant-order-system/backend && node --check server.js && cd ../..
      - echo "Running npm audit..."
      - cd restaurant-order-system/backend && npm audit --audit-level=high || true && cd ../..
      - echo "Building Docker image..."
      - export IMAGE_FULL="491694398940.dkr.ecr.ap-south-1.amazonaws.com/dev/restaurant-order-system:latest"
      - docker build --file restaurant-order-system/backend/Dockerfile --target production --build-arg NODE_ENV=production --tag $IMAGE_FULL restaurant-order-system/backend

  post_build:
    commands:
      - echo "=== POST-BUILD PHASE ==="
      - export IMAGE_FULL="491694398940.dkr.ecr.ap-south-1.amazonaws.com/dev/restaurant-order-system:latest"
      - echo "Pushing image to ECR..."
      - docker push $IMAGE_FULL
      - echo "Writing imagedefinitions.json..."
      - printf '[{"name":"restaurant-order-system","imageUri":"%s"}]' $IMAGE_FULL > imagedefinitions.json
      - echo "=== DEPLOYMENT COMPLETE ==="

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes

cache:
  paths:
    - restaurant-order-system/backend/node_modules/**/*
